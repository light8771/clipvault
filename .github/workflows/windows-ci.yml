name: Windows 验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装已验证的 Winlibs GCC 16.1.0 POSIX UCRT
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.zip'
          $expectedHash = '4273565109cd8ab8ecef1b0dc2a56fd7f5c7ee0885840a1c011b9325160ec0c3'
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs-gcc-16.1.0.zip'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'clipvault-winlibs'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'Winlibs 下载 SHA-256 不匹配'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolRoot
          $compilerBin = Join-Path $toolRoot 'mingw64/bin'
          if (-not (Test-Path -LiteralPath (Join-Path $compilerBin 'gcc.exe'))) {
            throw 'Winlibs 编译器路径不存在'
          }
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: 工具链与格式
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go version
          gcc --version
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(git ls-files '*.go')
          $unformatted = @(& gofmt -l $files)
          if ($LASTEXITCODE -ne 0 -or $unformatted.Count -ne 0) {
            $unformatted | ForEach-Object { Write-Output "需要 gofmt：$_" }
            throw 'Go 格式检查失败'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 前端与订单脚本
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/check-web.ps1
          ./scripts/test-order-build.ps1
      - name: 加密依赖首次初始化预检
        shell: pwsh
        run: |
          go test ./internal/clipvault/storage/duckdb -run '^TestOpenEncryptedVerifiesKeyAndReleasesFailedOpen$' -count=1 -timeout=5m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Go 全量
        shell: pwsh
        run: |
          go test ./... -count=1 -timeout=30m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Go 竞态
        shell: pwsh
        run: |
          go test -race ./... -count=1 -timeout=30m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 无私钥验证性构建
        shell: pwsh
        run: |
          $public = (Get-Content signing/cv-dev.ed25519.pub -Raw).Trim()
          ./scripts/build-release.ps1 -Output dist/ClipVault-ci.exe -KeyId cv-ci-test -PublicKey $public
