  <!-- ── 重启遮罩 ── -->
  <div class="modal-overlay hidden" id="restartOverlay">
    <div class="modal-box secondary-box" role="status" aria-live="polite" data-modal-panel>
      <div class="modal-body u-inline-17">
        <div class="restart-spinner" id="restartSpinner"></div>
        <h2 class="restart-title">正在重启服务</h2>
        <p class="restart-desc">新页面将自动在新标签页打开，可关闭本页面</p>
      </div>
    </div>
  </div>

  <!-- ── 重启确认对话框 ── -->
  <div class="modal-overlay hidden" id="restartConfirm">
    <div class="modal-box secondary-box" role="dialog" aria-modal="true" aria-labelledby="restartConfirmTitle" data-modal-panel>
      <div class="modal-head">
        <span class="modal-title" id="restartConfirmTitle">重启确认</span>
      </div>
      <div class="modal-body u-inline-16">
        <p class="u-inline-18">监听地址已修改，需要重启服务才能生效。是否立即重启？</p>
        <div class="u-inline-19">
          <button class="btn-cancel" type="button" id="restartCancelBtn">稍后</button>
          <button class="lock-btn u-inline-20" type="button" id="restartConfirmBtn">立即重启</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 清理历史弹窗 ── -->
  <div class="modal-overlay hidden" id="cleanupModal" data-action="close-cleanup-modal">
    <div class="modal-box cleanup-modal" role="dialog" aria-modal="true" aria-labelledby="cleanupModalTitle" data-modal-panel>
      <div class="modal-head">
        <span class="modal-title" id="cleanupModalTitle">清理历史记录</span>
        <div class="modal-acts">
          <button class="modal-close" type="button" data-action="close-cleanup-modal" aria-label="关闭清理窗口" title="关闭">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-body cleanup-body">
        <div class="cleanup-modes" role="radiogroup" aria-label="清理范围">
          <label class="cleanup-mode">
            <input type="radio" name="cleanupMode" value="all" checked>
            <span class="cleanup-mode-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </span>
            <span class="cleanup-mode-text">
              <strong>全部历史</strong>
              <small>删除库中所有剪贴板记录</small>
            </span>
          </label>
          <label class="cleanup-mode">
            <input type="radio" name="cleanupMode" value="range">
            <span class="cleanup-mode-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            </span>
            <span class="cleanup-mode-text">
              <strong>按时间范围</strong>
              <small>仅删除起止时间内的记录</small>
            </span>
          </label>
        </div>
        <div class="cleanup-range hidden" id="cleanupRangeFields">
          <input type="datetime-local" id="cleanupFrom" step="1" aria-label="开始时间">
          <span class="cleanup-range-sep">至</span>
          <input type="datetime-local" id="cleanupTo" step="1" aria-label="结束时间">
        </div>
        <label class="cleanup-keep">
          <input type="checkbox" id="cleanupPreserveStarred" checked>
          <span class="cleanup-keep-box">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          <span>保留已收藏的记录</span>
        </label>
        <div class="cleanup-preview" id="cleanupPreview">将删除 0 条记录</div>
      </div>
      <div class="cleanup-foot">
        <button class="btn-cancel" type="button" data-action="close-cleanup-modal">取消</button>
        <button class="btn-danger" id="cleanupConfirmBtn" type="button" data-action="confirm-cleanup" disabled>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          删除
        </button>
      </div>
    </div>
  </div>
