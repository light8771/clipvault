    </aside>

    <div class="settings-main">
      <header class="sd-head">
        <h1 class="sd-title">运行维护</h1>
        <p class="sd-desc">运行信息、诊断日志与运行维护。导出诊断日志需要二次验证。</p>
      </header>

      <!-- 运行信息 -->
      <section class="sysinfo" aria-label="运行信息">
        <div class="sysinfo-head">
          <h2 class="sysinfo-title">运行信息</h2>
          <span class="sysinfo-note">本机实时数据</span>
        </div>
        <dl class="sysinfo-grid">
          <div class="sysinfo-item">
            <dt>录制状态</dt>
            <dd id="sysStatus">-</dd>
          </div>
          <div class="sysinfo-item">
            <dt>历史记录</dt>
            <dd id="sysRecords">-</dd>
          </div>
          <div class="sysinfo-item">
            <dt>数据库大小</dt>
            <dd id="sysDBSize">-</dd>
          </div>
          <div class="sysinfo-item">
            <dt>运行时间</dt>
            <dd id="sysUptime">-</dd>
          </div>
          <div class="sysinfo-item">
            <dt>版本</dt>
            <dd id="sysVersion">-</dd>
          </div>
          <div class="sysinfo-item sysinfo-item-wide">
            <dt>数据目录</dt>
            <dd class="sysinfo-path" id="sysDataDir">-</dd>
          </div>
        </dl>
      </section>

      <section class="ssec" id="s-maintenance">
        <div class="fsec" id="s-maintenance-diag">
          <h3 class="fsec-title">诊断日志</h3>
          <p class="fsec-desc">导出问题排查所需的脱敏运行日志</p>
        </div>
        <div class="ssec-fields">
          <div class="field-row">
            <div class="field-info">
              <span class="field-label">运行日志</span>
              <p class="field-hint">导出最近 7 天、最多 8 MiB 的脱敏日志和运行环境信息，不包含剪贴板内容、数据库、配置或密钥。请将 ZIP 文件发送给技术支持。</p>
            </div>
            <button type="button" class="btn-export" id="diagnosticsExportBtn">导出运行日志</button>
          </div>
        </div>
      </section>
    </div>
  </main>
