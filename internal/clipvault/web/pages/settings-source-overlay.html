  <!-- ── 来源应用管理弹窗 ── -->
  <div class="modal-overlay hidden" id="sourceAppsModal" data-action="close-source-apps">
    <div class="modal-box source-apps-modal" role="dialog" aria-modal="true" aria-labelledby="sourceAppsTitle" data-modal-panel>
      <div class="modal-head">

        <span class="modal-title" id="sourceAppsTitle">{{T "source_apps.title"}}</span>
        <button class="modal-close" type="button" data-action="close-source-apps" aria-label="{{T "common.close"}}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="source-apps-toolbar">
        <input type="search" id="sourceAppsFilter" class="field-input source-apps-search" placeholder='{{T "source_apps.search_placeholder"}}' autocomplete="off">
        <div class="source-apps-mode" role="radiogroup" aria-label="{{T "source_apps.mode_label"}}">
          <label><input type="radio" name="sourceAppsMode" value="all"> {{T "source_apps.mode_all"}}</label>
          <label><input type="radio" name="sourceAppsMode" value="selected"> {{T "source_apps.mode_selected"}}</label>
        </div>
      </div>
      <div class="modal-body source-apps-body">
        <div class="source-apps-head" aria-hidden="true"><span>{{T "source_apps.col_dropdown"}}</span><span>{{T "source_apps.col_original"}}</span><span>{{T "source_apps.col_alias"}}</span></div>
        <div id="srcAliases" class="src-aliases"></div>
      </div>
      <div class="source-apps-footer">
        <span class="field-hint" id="sourceAppsSelectionHint"></span>
        <div class="source-apps-actions">
          <button class="btn-cancel" type="button" data-action="close-source-apps">{{T "common.cancel"}}</button>
          <button class="lock-btn" id="sourceAppsSaveBtn" type="button" data-action="save-source-apps">{{T "common.save"}}</button>
        </div>
      </div>
    </div>
  </div>
