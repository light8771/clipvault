    </aside>

    <div class="settings-main">
      <header class="sd-head">
        <h1 class="sd-title">{{T "app.title.license"}}</h1>
        <p class="sd-desc">{{T "license.desc"}}</p>
      </header>

      <section class="ssec" id="s-license">
        <div class="ssec-fields">
          <div class="field-row">
            <div class="field-info">
              <span class="field-label">{{T "license.current_status"}}</span>
              <p class="field-hint" id="licenseStatusHint">{{T "license.loading_status"}}</p>
            </div>
            <span class="license-status" id="licenseStatusBadge">{{T "license.checking"}}</span>
          </div>
          <div class="field-row">
            <div class="field-info">
              <label class="field-label" for="licenseMachineCode">{{T "license.machine_code"}}</label>
              <p class="field-hint">{{T "license.machine_code_hint"}}</p>
            </div>
            <div class="license-copy-row">
              <input id="licenseMachineCode" class="field-input license-machine" type="text" readonly value="{{T "common.loading"}}">
              <button class="btn-export" type="button" data-action="copy-purchase-info">{{T "license.copy_purchase_info"}}</button>
            </div>
          </div>
          <div class="license-activate-block" id="licenseActivateBlock">
            <label class="field-label" for="licenseTokenInput">{{T "license.activation_code"}}</label>
            <p class="field-hint">{{T "license.activation_code_hint"}}</p>
            <textarea id="licenseTokenInput" class="field-input license-token-input" rows="4" autocomplete="off" spellcheck="false" placeholder="CV1.…"></textarea>
            <div class="license-actions">
              <button class="lock-btn license-activate-btn" id="licenseActivateBtn" type="button" data-action="activate-license">{{T "nav.activate_now"}}</button>
              <span class="license-message" id="licenseMessage" role="alert" aria-live="polite"></span>
            </div>
          </div>
          <div class="field-row hidden" id="licenseDetailsRow">
            <div class="field-info">
              <span class="field-label">{{T "license.license_id"}}</span>
              <p class="field-hint">{{T "license.license_id_hint"}}</p>
            </div>
            <code id="licenseIdText"></code>
          </div>
        </div>
      </section>
    </div>
  </main>
