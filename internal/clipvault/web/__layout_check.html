<!doctype html>
<html lang="zh-CN" data-history-layout="sidebar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>layout check</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/history.css">
  <link rel="stylesheet" href="/source-apps.css">
  <link rel="stylesheet" href="/modals.css">
  <link rel="stylesheet" href="/responsive.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/security.css">
  <link rel="stylesheet" href="/groups.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/utilities.css">
</head>
<body>
  <nav class="navbar"><div class="nav-inner"><div class="nav-brand"><span class="brand-name">ClipVault</span></div></div></nav>

  <main id="viewHistory">
    <div class="search-wrap">
      <div class="search-box">
        <input id="q" type="search" placeholder="搜索剪切板历史...">
      </div>
    </div>

    <div class="history-side">
    <div class="controls">
      <div class="filter-group" id="kindFilters">
        <button class="filter-chip active" data-kind="">全部</button>
        <button class="filter-chip" data-kind="__starred__">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          收藏
        </button>
        <button class="filter-chip" data-kind="text">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
          文本
        </button>
        <button class="filter-chip" data-kind="image">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          图片
        </button>
        <button class="filter-chip" data-kind="video">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          视频
        </button>
        <button class="filter-chip" data-kind="archive">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
          压缩包
        </button>
        <button class="filter-chip" data-kind="office">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Office
        </button>
        <button class="filter-chip" data-kind="files">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          其他文件
        </button>
        <button class="filter-chip" data-kind="__sensitive__">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          敏感数据
        </button>
        <button class="filter-chip filter-chip-group" data-kind="__group__" id="groupChip">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M9 12h6M9 16h4"/></svg>
          分组
          <svg class="group-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div class="ctrl-right">
        <div class="src-exe-dropdown" id="srcExeDropdown">
          <button type="button" class="src-exe-btn open" id="srcExeBtn" aria-haspopup="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            <span>来源应用</span>
            <span class="src-exe-count" id="srcExeCount">2</span>
            <svg class="src-exe-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="src-exe-pop" id="srcExePop">
            <div class="src-exe-mask" aria-hidden="true"></div>
            <div class="src-exe-sheet">
            <div class="src-exe-search">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="search" id="srcExeFilter" placeholder="搜索应用..." autocomplete="off">
            </div>
            <div class="src-exe-list" id="srcExeList">
              <label class="src-exe-opt"><input type="checkbox" checked><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">msedge.exe</span><span class="src-exe-cnt">7</span></label>
              <label class="src-exe-opt"><input type="checkbox" checked><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">Code.exe</span><span class="src-exe-cnt">4</span></label>
              <label class="src-exe-opt"><input type="checkbox"><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">explorer.exe</span><span class="src-exe-cnt">12</span></label>
              <label class="src-exe-opt"><input type="checkbox"><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">notepad.exe</span><span class="src-exe-cnt">3</span></label>
              <label class="src-exe-opt"><input type="checkbox"><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">wechat.exe</span><span class="src-exe-cnt">9</span></label>
              <label class="src-exe-opt"><input type="checkbox"><span class="src-exe-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><polyline points="20 6 9 17 4 12"/></svg></span><span class="src-exe-name">dingtalk.exe</span><span class="src-exe-cnt">5</span></label>
            </div>
            <div class="src-exe-foot">
              <span class="src-exe-foot-info" id="srcExeFootInfo">已选 2 个来源</span>
              <button type="button" class="src-exe-reset" id="srcExeReset">清除筛选</button>
            </div>
            </div>
          </div>
        </div>
        <label class="ar-toggle">
          <input type="checkbox" id="ar">
          <span>自动刷新</span>
        </label>
      </div>
    </div>

    <div class="date-filter-bar" id="dateFilterBar">
      <span class="dfb-head">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="u-inline-1"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="dfb-label">日期</span>
      </span>
      <input type="date" id="dateFrom" class="date-input">
      <span class="dfb-sep">—</span>
      <input type="date" id="dateTo" class="date-input">
      <button id="clearDateBtn" class="btn-date-clear hidden">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        清除
      </button>
    </div>
    </div><!-- /.history-side -->

    <div class="list-meta">
      <span id="rc" class="result-count">2 条结果</span>
    </div>

    <section class="list" id="list">
      <article data-kind="text">
        <div class="card-body"><pre>.8D5Mqc!jNkgJqc</pre></div>
        <div class="card-foot">
          <div class="card-meta">
            <span class="mid">#1</span>
            <span class="mkind mkind-text">文本</span>
            <span class="mtime">16分钟前</span>
            <span class="mchars">15 字</span>
            <span class="msource">msedge.exe</span>
          </div>
          <div class="card-acts">
            <button class="ab cp">复制</button>
          </div>
        </div>
      </article>
      <article data-kind="image">
        <div class="card-body"><pre>[图片]</pre></div>
        <div class="card-foot">
          <div class="card-meta">
            <span class="mid">#2</span>
            <span class="mkind mkind-image">图片</span>
            <span class="mtime">1小时前</span>
            <span class="msource">Code.exe</span>
          </div>
          <div class="card-acts">
            <button class="ab cp">复制</button>
          </div>
        </div>
      </article>
    </section>

    <div class="pagination" id="pagination">
      <button class="page-btn" id="prevBtn" disabled>上一页</button>
      <span class="page-info" id="pageInfo">1–2 / 共 2 条</span>
      <button class="page-btn" id="nextBtn">下一页</button>
    </div>
  </main>
</body>
</html>
